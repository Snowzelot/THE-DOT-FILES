# ==========================================
# CATPPUCCIN MOCHA COLOR PALETTE
# ==========================================
$base         = rgb(1e1e2e)
$surface0     = rgb(313244)
$surface1     = rgb(45475a)
$text         = rgb(cdd6f4)
$subtext0     = rgb(a6adc8)
$lavender     = rgb(b4befe)
$red          = rgb(f38ba8)
$green        = rgb(a6e3a1)
$yellow       = rgb(f9e2af)

# ==========================================
# BACKGROUND
# ==========================================
background {
    monitor =
    path = /home/snowzelot/Bilder/Wallpapers/misty-boat.jpg   # Takes a screenshot of your screen (or set to your wallpaper path)
    color = $base
    blur_passes = 3     # Set to 0 to disable blur
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# ==========================================
# CLOCK
# ==========================================
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $text
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# ==========================================
# USER GREETING
# ==========================================
label {
    monitor =
    text = Hey, $USER
    color = $subtext0
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

# ==========================================
# INPUT FIELD (NO ROUNDED CORNERS)
# ==========================================
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    
    outer_color = $lavender
    inner_color = $surface0
    font_color = $text
    
    fade_on_empty = false
    rounding = 0        # Sharp square corners

    # State colors
    check_color = $yellow
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -50
    halign = center
    valign = center
}
